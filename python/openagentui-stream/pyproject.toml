[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagentui-stream"
version = "0.0.36"
description = ""
authors = [
  { name="Simon Farshid", email="simon@openagentui.dev" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "starlette>=0.37.2",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=0.3.0"]
redis = ["redis>=5"]
dev = ["pytest<8", "redis>=5"]

[project.urls]
Homepage = "https://github.com/RealDealCPA-VR/OpenAgentUI"
Issues = "https://github.com/RealDealCPA-VR/OpenAgentUI/issues"
